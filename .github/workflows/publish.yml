name: Build and Publish cln-sphinx

# Publish a GitHub release to build. The release tag becomes the image tag.
#   pre-release  -> ghcr.io/stakwork/cln-sphinx:<tag>            (staging)
#   full release -> ghcr.io/stakwork/cln-sphinx:<tag> and :latest (swarm hosts pull latest)

on:
  release:
    types: [published]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/stakwork/cln-sphinx:${{ github.ref_name }}-amd64
          cache-from: type=registry,ref=ghcr.io/stakwork/cln-sphinx:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/stakwork/cln-sphinx:buildcache-amd64,mode=max
          provenance: false
          sbom: false

  build-arm64:
    runs-on: ubuntu-arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/stakwork/cln-sphinx:${{ github.ref_name }}-arm64
          cache-from: type=registry,ref=ghcr.io/stakwork/cln-sphinx:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/stakwork/cln-sphinx:buildcache-arm64,mode=max
          provenance: false
          sbom: false

  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch manifest (version tag)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/stakwork/cln-sphinx:${{ github.ref_name }} \
            ghcr.io/stakwork/cln-sphinx:${{ github.ref_name }}-amd64 \
            ghcr.io/stakwork/cln-sphinx:${{ github.ref_name }}-arm64

      - name: Push latest (full releases only)
        if: ${{ !github.event.release.prerelease }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/stakwork/cln-sphinx:latest \
            ghcr.io/stakwork/cln-sphinx:${{ github.ref_name }}

      - name: Smoke test the published image
        run: |
          IMG=ghcr.io/stakwork/cln-sphinx:${{ github.ref_name }}
          docker pull "$IMG"
          docker run --rm --entrypoint lightningd "$IMG" --version
          docker run --rm --entrypoint ls "$IMG" -la \
            /usr/local/libexec/c-lightning/plugins/gateway-cln-extension \
            /usr/libexec/c-lightning/plugins/cln-grpc
